# DSV4.1 serving host tuning for DGX Spark (GB10). Install on every node:
#   sudo cp 99-dsv41-serving.conf /etc/sysctl.d/ && sudo sysctl --system
#
# compaction_proactiveness=0: on a Spark the GPU's memory IS ordinary system pages, so the
# kernel's background compactor unmaps pages from the GPU as it migrates them. A serving box
# allocates once at boot and gains nothing from the upkeep; direct compaction on a real
# allocation failure still works. Reasoning from bilikaz/qwen38-flash-next-cluster-recipe
# (measured there: 4-5s stall every ~37s). On our DSV4.1 world, 2026-09-13: every measured
# boot with this set landed in fast mode (73-78 tok/s) after a week of ~50/50 65-vs-74.
vm.compaction_proactiveness = 0
# swappiness=10: keep the kernel from paging model/page-cache during long-context prefill.
# Runtime-only sysctl -w did not survive a node reboot; persist it.
vm.swappiness = 10
