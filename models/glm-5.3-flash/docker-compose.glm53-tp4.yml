# GLM-5.3-Flash (NVFP4) on 4x DGX Spark — TP4, vLLM external-launcher mode.
# Adapted from barrydeen/glm53-flash-dgx-spark (2x TP2) to our 4-node CX-7 fabric.
# Per-node differences come from the .env file (see .env.node-*.example).
services:
  vllm-glm53:
    image: vllm/vllm-openai:glm53-flash-arm64-cu130
    network_mode: host
    ipc: host
    shm_size: "64gb"

    ulimits:
      memlock: -1
      stack: 67108864

    gpus: all

    devices:
      - /dev/infiniband:/dev/infiniband

    volumes:
      # Local checkpoint copy on every node (no cross-node weight sharing).
      - /home/jun/models/glm-5.3-flash-nvfp4:/models/glm:ro
      # GB10 dense-fallback: force is_v32=False (sparse MLA has no sm_121 kernel).
      - /home/jun/spark-bench-glm53/patch/attention.py:/usr/local/lib/python3.12/dist-packages/vllm/models/glm5next/nvidia/attention.py:ro
      - /home/jun/spark-bench-glm53/patch:/nlp:ro

    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_XET: "1"
      VLLM_HOST_IP: "${VLLM_HOST_IP}"
      VLLM_PLUGINS: "nope_mla"
      PYTHONPATH: "/nlp"

      # GB10 = sm_121a — without these, kernels JIT-compile for the wrong arch.
      TORCH_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_CUDA_ARCH_LIST: "12.1a"
      FLASHINFER_DISABLE_VERSION_CHECK: "1"
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

      # NCCL over the switched CX-7 fabric (192.168.2.0/24, RoCE HCA rocep1s0f1).
      # Never let this fall back to Tailscale or the 192.168.68.x WiFi/LAN.
      NCCL_NET: "IB"
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: "rocep1s0f1"
      NCCL_SOCKET_IFNAME: "enp1s0f1np1"
      GLOO_SOCKET_IFNAME: "enp1s0f1np1"
      TP_SOCKET_IFNAME: "enp1s0f1np1"
      NCCL_IB_ADDR_FAMILY: "AF_INET"
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_IB_ADDR_RANGE: "192.168.2.0/24"
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: "WARN"
      NCCL_NVLS_ENABLE: "0"

      NODE_RANK: "${NODE_RANK}"
      HEADLESS: "${HEADLESS:-}"
      MASTER_ADDR: "${MASTER_ADDR}"
      MASTER_PORT: "${MASTER_PORT:-25000}"

    entrypoint: ["bash", "-lc"]
    command:
      - >
        exec vllm serve /models/glm
        --served-model-name glm-5.3-flash-nvfp4
        --host ${VLLM_HOST:-127.0.0.1}
        --port ${VLLM_PORT:-8888}
        --trust-remote-code
        --tensor-parallel-size 4
        --pipeline-parallel-size 1
        --max-model-len ${MAX_MODEL_LEN:-131072}
        --max-num-seqs ${MAX_NUM_SEQS:-8}
        --gpu-memory-utilization ${GPU_MEMORY_UTILIZATION:-0.85}
        --enforce-eager
        --enable-prefix-caching
        --kv-cache-dtype bfloat16
        --enable-chunked-prefill
        --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
        --distributed-executor-backend mp
        --nnodes 4
        --node-rank ${NODE_RANK}
        --master-addr ${MASTER_ADDR}
        --master-port ${MASTER_PORT:-25000}
        ${HEADLESS:+--headless}
